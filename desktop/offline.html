<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nordico Informes</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #fafafa;
    font-family: 'Segoe UI', system-ui, sans-serif; color: #242424; }
  .box { text-align: center; max-width: 420px; padding: 24px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
  p { color: #616161; margin: 0 0 20px; line-height: 1.5; }
  a { display: inline-block; background: #0f6cbd; color: #fff; text-decoration: none;
    padding: 8px 20px; border-radius: 4px; font-weight: 600; }
  a:hover { background: #115ea3; }
</style>
</head>
<body>
  <div class="box">
    <h1>Sin conexión</h1>
    <p>No se pudo conectar con el servidor de Informes Técnicos. Revisa tu conexión a internet e inténtalo de nuevo.</p>
    <a href="nordico://reintentar">Reintentar</a>
  </div>
</body>
</html>
